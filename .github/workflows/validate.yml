name: Validate

on:
  pull_request:
  push:
    branches: [main]

# Read-only is all validation needs.
permissions:
  contents: read

# Cancel superseded runs.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job; don't persist credentials (artipacked).
          persist-credentials: false
      - name: Set up mise toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # npm-backend tools install as a pnpm symlink farm pointing into
          # pnpm's global store, which lives outside the cached mise dir. A
          # cache hit restores the links without their targets, so renovate's
          # entry point disappears. Install fresh instead.
          cache: false
      - name: Validate Renovate config
        run: mise run validate
      # zizmor's online audits need a token; the built-in one is enough.
      - name: Audit workflows with zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run zizmor
