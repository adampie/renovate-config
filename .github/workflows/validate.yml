name: Validate

on:
  pull_request:
  push:
    branches: [main]

# Read-only is all validation needs.
permissions:
  contents: read

# Cancel superseded runs.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Read-only job; don't persist credentials (artipacked).
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Use the devenv binary cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      # Runs the git hooks: Renovate validation and zizmor.
      - name: Validate Renovate config and audit workflows
        env:
          # zizmor's online audits need a token; the built-in one is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devenv test
